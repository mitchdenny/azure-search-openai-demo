[project]
name = "searchopenai"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp",
    "azure-ai-documentintelligence==1.0.2",
    "azure-cognitiveservices-speech",
    "azure-cosmos",
    "azure-functions>=1.24.0",
    "azure-identity",
    "azure-monitor-opentelemetry",
    "azure-search-documents==12.1.0b1",
    "azure-storage-blob",
    "azure-storage-file-datalake",
    "beautifulsoup4",
    "cryptography",
    "jinja2",
    "msal",
    "msgraph-sdk",
    "openai>=1.109.1",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-aiohttp-client",
    "opentelemetry-instrumentation-asgi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-openai",
    "pillow",
    "pyjwt",
    "pymupdf",
    "pypdf",
    "python-dotenv",
    "quart",
    "quart-cors",
    "rich",
    "tenacity",
    "tiktoken",
    "types-beautifulsoup4",
    "types-pillow",
    "typing-extensions",
    "uvicorn",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py310"
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["E501", "E701", "UP045"] # line too long, multiple statements on one line, keep Optional[X]
src = ["app/backend", "scripts", "app/functions", "evals"]

[tool.ruff.lint.isort]
known-local-folder = ["scripts"]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["app/backend", "scripts", "app/functions", "evals"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.paths]
source = ["scripts", "app"]

[tool.coverage.run]
omit = ["evals/*"]

[tool.coverage.report]
show_missing = true

[tool.ty.environment]
python-version = "3.10"
# Root directories for module resolution (so imports like "from prepdocslib import ..." work)
root = ["app/backend", "scripts", "app/functions", "evals"]

[tool.ty.src]
# Directories to actually type-check (excludes tests folder which has many mock-related type errors).
# Note: evals/evaltools is intentionally NOT included here — it depends on heavy eval-only packages
# (azure-ai-evaluation, pandas, typer, ...) that the main python-test job doesn't install. It is
# type-checked separately in the evals-test workflow, where evals/requirements.txt is installed.
include = ["app/backend", "scripts", "app/functions", "evals/eval_compare.py"]

[tool.ty.rules]
# Downgrade warnings that are too strict for this codebase
redundant-cast = "ignore"
possibly-missing-attribute = "ignore"
